name: Build Stealth APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            ccache \
            git \
            libncurses5 \
            libssl-dev \
            libffi-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-
      
      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tail -50
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ServiziWiFiGoogle-APK
          path: bin/*.apk
