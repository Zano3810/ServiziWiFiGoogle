name: Build Stealth APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache git \
            libncurses6 libssl-dev libffi-dev zlib1g-dev \
            openjdk-17-jdk unzip autoconf automake libtool pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            python3-pip
      - name: Install Python deps
        run: |
          pip install --user Cython==3.0.11 virtualenv
          pip install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer -v android debug 2>&1 | tail -120
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ServiziWiFiGoogle-APK
          path: bin/*.apk
